dir: local
	path /var/lib/vz
	content backup,import,vztmpl,iso

lvmthin: local-lvm
	thinpool data
	vgname pve
	content rootdir,images

dir: hdd-storage
	path /srv/proxmox
	content images,iso,snippets,vztmpl,rootdir,backup
	prune-backups keep-all=1
	shared 0

dir: usb-storage
	path /mnt/backup/proxmox
	content snippets,backup
	prune-backups keep-all=1
	shared 0

