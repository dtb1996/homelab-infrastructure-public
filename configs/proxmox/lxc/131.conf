arch: amd64
cores: 2
features: nesting=1
hostname: immich
memory: 3072
mp0: /mnt/backup/media/Photos,mp=/photos
nameserver: 192.0.2.30 192.0.2.50
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.0.2.1,hwaddr=02:ff:5a:5e:c7:12,ip=192.0.2.23/24,type=veth
onboot: 1
ostype: ubuntu
rootfs: local-lvm:vm-131-disk-0,size=16G
startup: order=30,up=15,down=60
swap: 512
unprivileged: 1
lxc.cgroup2.devices.allow: c 226:* rwm
lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir
