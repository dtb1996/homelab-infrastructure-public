arch: amd64
cores: 2
features: keyctl=1,nesting=1
hostname: docker
memory: 2048
mp0: /mnt/backup/media,mp=/media
mp1: /mnt/backup/documents,mp=/documents
mp2: /srv/downloads,mp=/downloads
mp3: /mnt/backup/shared,mp=/shared
mp4: /srv/apps/paperless,mp=/storage/paperless
nameserver: 192.0.2.30 192.0.2.50
net0: name=eth0,bridge=vmbr0,firewall=1,hwaddr=02:1d:8a:48:61:a0,ip=dhcp,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-100-disk-0,size=30G
startup: order=2,up=30
swap: 1024
unprivileged: 1
lxc.cgroup2.devices.allow: c 226:0 rwm
lxc.cgroup2.devices.allow: c 226:128 rwm
lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir
