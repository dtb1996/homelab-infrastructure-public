arch: amd64
cores: 2
hostname: plex
memory: 3072
mp0: /mnt/backup/media,mp=/media
nameserver: 192.0.2.30 192.0.2.50
net0: name=eth0,bridge=vmbr0,firewall=1,gw=192.0.2.1,hwaddr=02:df:93:21:2c:63,ip=192.0.2.22/24,type=veth
onboot: 0
ostype: debian
rootfs: local-lvm:vm-102-disk-0,size=16G
startup: order=30,up=15,down=60
swap: 1024
lxc.cgroup2.devices.allow: c 226:* rwm
lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir
