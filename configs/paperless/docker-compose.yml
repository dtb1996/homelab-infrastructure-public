services:

  redis:
    image: redis:7
    container_name: paperless-redis
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: paperless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /storage/paperless/db:/var/lib/postgresql/data

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - db
      - redis

    ports:
      - "8010:8000"

    environment:
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}

      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}

      PAPERLESS_URL: https://paperless.example.com

      PAPERLESS_TIME_ZONE: America/New_York

      PAPERLESS_OCR_LANGUAGE: eng

      USERMAP_UID: 1000
      USERMAP_GID: 1000

    volumes:
      - /storage/paperless/data:/usr/src/paperless/data
      - /documents/paperless/media:/usr/src/paperless/media
      - /documents/paperless/export:/usr/src/paperless/export
      - /documents/paperless/consume:/usr/src/paperless/consume
