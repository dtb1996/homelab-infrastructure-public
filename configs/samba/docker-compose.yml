services:
  samba:
    image: dockurr/samba
    container_name: samba

    ports:
      - "137:137/udp"
      - "138:138/udp"
      - "139:139"
      - "445:445"

    environment:
      NAME: HOMELAB
      USER: ${SAMBA_USER}
      PASS: ${SAMBA_PASSWORD}

    volumes:
      - /media:/storage/media
      - /downloads:/storage/downloads
      - /documents:/storage/documents

    restart: unless-stopped
